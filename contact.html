  <style>

</head>
<body class="text-white min-h-screen flex flex-col">
  <div id="root" class="flex-1 flex flex-col"></div>

  <script>
    const SUPABASE_URL = "https://cwotoefcpjehfhxidbaw.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN3b3RvZWZjcGplaGZoeGlkYmF3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyMjE2MjEsImV4cCI6MjEwNjc5NzYyMX0.3aPe4qed65H27PiVHfL1kvb_Vj_QIsH69chNbAp2ZDw";
    let sb = null;

    const DEFAULT_DATA = { socials: { tiktok: "https://tiktok.com", instagram: "https://instagram.com", spotify: "https://spotify.com", audiomack: "https://audiomack.com", facebook: "https://facebook.com", threads: "https://threads.net", snapchat: "https://snapchat.com", twitter: "https://twitter.com", youtube: "https://youtube.com", soundcloud: "https://soundcloud.com", applemusic: "https://music.apple.com" } };
    let appData = JSON.parse(JSON.stringify(DEFAULT_DATA));

    // Official Audiomack logo — Font Awesome has no Audiomack brand icon,
    // so the real mark is inlined here and painted with currentColor.
    const AM_ICON_PATH = "M.331 11.378s.5418-.089.765.1439c.2234.2332.077.7156-.2195.7237-.2965.01-.5705.063-.765-.1439-.1946-.2066-.1424-.6218.2195-.7237m5.881 3.2925c-.0522.01-.1075-.018-.164-.059-.3884-.5413-.5287-2.3923-.707-2.5025-.185-.1144-.8545 1.0255-2.1862.903-.5569-.051-1.1236-.4121-1.4573-.662.031-.4206.0364-1.4027.8659-1.0833.5038.1939 1.3667.7266 2.1245-.23.8378-1.0579 1.2999-.7506 1.577-.5206.2771.23.0925 1.4259.5058 1.0916.4133-.3343 2.082-2.4103 2.082-2.4103s1.292-1.303 1.4898.067c.1979 1.3698 1.0403 2.8877 1.2635 2.8445.2234-.043 2.8223-5.3253 3.1945-5.666.3722-.3409 1.6252-.2961 1.5657.5781-.0596.8742-.1871 6.308-.1871 6.308s-.147 1.5311.0924.7128c.0992-.3392.206-.6453.3392-1.0024.6414-2.0534 1.734-5.5613 2.2784-7.3688.1252-.4325.233-.8037.3166-1.0891l.0001-.0008a3.5925 3.5925 0 0 1 .0973-.3305c.0455-.1532.0763-.2546.0858-.2813.0243-.068.0925-.1192.1884-.157.0962-.061.1995-.064.3165-.067.3021-.027.6907.012 1.0401.1119.1018 0 .2125.037.3172.1118v.0001s.0063 0 .0151.01c.0023 0 .0048 0 .0073.01.0219.015.0573.045.0983.095.0012 0 .0025 0 .004.01.017.021.0341.045.0515.073.1952.2863.315.814.1948 1.7498-.2996 2.3354-.5316 7.1397-.5316 7.1397s-.0461.2298.4353-.782c.0167-.035.0383-.066.058-.098.026-.017.0552-.042.0913-.085.2974-.3546 1.0968-.5629 1.6512-.5586.2336.028.4293.087.5462.1609.2188.333.0897 1.562.0897 1.562-.4612.043-1.3403.2908-1.6519.3366-.3118.046-.7852 2.0699-1.4433 1.8629-.6581-.2069-2.1246-1.1268-2.1246-1.2533 0-.1102.1152-1.4546.1453-1.8016.0022-.024.004-.046.0058-.068a.152.152 0 0 1 .0014-.014l-.0002.0003c.0213-.2733.0023-.3927-.1239-.1199-.1086.2346-.581 1.7359-1.1078 3.3709-.0556.1429-1.0511 3.1558-1.1818 3.5231-.156.4261-.287.7523-.3776.921-.1378.1867-.3234.3036-.5826.2252-.6465-.1954-1.4654-1.0889-1.473-1.3106-.0155-1.2503.0608-7.973-.2423-7.4127-.311.5744-2.73 4.5608-2.73 4.5608-.0405.01-.0705.01-.1062.01-.1712-.019-.4366-.074-.51-.2384-.004-.01-.0094-.018-.0129-.028-.0035-.01-.0075-.022-.0135-.04-.0329-.1097-.0463-.2289-.0753-.3265-.1082-.3652-.2813-.8886-.463-1.421-.2784-.9079-.5654-1.8366-.6127-1.9391-.0923-.2007-.2268-.116-.3475-.0002-.54.458-1.6868 2.4793-2.7225 2.5898";
    function amIcon(cls) {
      return `<svg viewBox="0 0 24 24" fill="currentColor" class="${cls}" aria-hidden="true" style="width: 1em; height: 1em; display: inline-block; vertical-align: -0.125em;"><path d="${AM_ICON_PATH}"/></svg>`;
    }
    function escapeHtml(str) { if (!str) return ''; return String(str).replace(/[&<>"']/g, function(m) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]; }); }

    function Header() {
      return `<nav class="sticky top-0 z-50 bg-black/90 backdrop-blur-md border-b border-white/10"><div class="max-w-7xl mx-auto px-6 h-14 flex items-center justify-between gap-4"><a href="index.html" class="text-lg font-black tracking-widest text-white hover:italic transition-all shrink-0">LEO SNOW</a><div class="flex items-center gap-6 text-[11px] font-bold uppercase tracking-[0.18em] text-gray-300"><a href="index.html" class="hover:text-white border-b-2 border-transparent hover:border-[#089908] transition-all">Home</a><a href="music.html" class="hover:text-white border-b-2 border-transparent hover:border-[#089908] transition-all">Music</a><a href="about.html" class="hover:text-white border-b-2 border-transparent hover:border-[#089908] transition-all">About</a><a href="merch.html" class="hover:text-white border-b-2 border-transparent hover:border-[#089908] transition-all">Merch</a><a href="contact.html" class="text-white border-b-2 border-[#089908] transition-all">Contact</a></div></div></nav>`;
    }

    function toast(msg, type) {
      const t = document.createElement('div');
      t.className = 'fixed bottom-6 left-1/2 -translate-x-1/2 z-[100] px-6 py-3 rounded-xl font-black text-sm shadow-lg ' + (type === 'error' ? 'bg-[#eb0905] text-white' : 'bg-[#089908] text-black');
      t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(() => { t.style.transition = 'opacity 0.3s'; t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 2600);
    }

    function ContactPage() {
      const s = appData.socials || {};
      const platforms = [["instagram","fa-brands fa-instagram","Instagram"],["tiktok","fa-brands fa-tiktok","TikTok"],["youtube","fa-brands fa-youtube","YouTube"],["spotify","fa-brands fa-spotify","Spotify"],["soundcloud","fa-brands fa-soundcloud","SoundCloud"],["audiomack",null,"Audiomack"],["applemusic","fa-brands fa-apple","Apple Music"],["twitter","fa-brands fa-x-twitter","X"],["facebook","fa-brands fa-facebook","Facebook"],["threads","fa-brands fa-threads","Threads"],["snapchat","fa-brands fa-snapchat","Snapchat"]];
      const chips = platforms.filter(([k]) => s[k]).map(([k, ic]) => `<a href="${escapeHtml(s[k])}" target="_blank" rel="noopener" aria-label="${k}" class="w-11 h-11 rounded-full border border-white/15 flex items-center justify-center text-white/80 hover:bg-[#089908] hover:text-black hover:border-[#089908] transition-all">${ic === null ? amIcon("text-lg") : `<i class="${ic} text-lg"></i>`}</a>`).join("");
      return `<main class="flex-1 relative py-24 px-6 overflow-hidden">
        <div class="absolute inset-x-0 -top-4 text-center pointer-events-none select-none font-black uppercase leading-none" style="font-size: clamp(4rem, 15vw, 15rem); color: rgba(255,255,255,0.04);">Contact</div>
        <div class="absolute -top-24 left-1/2 -translate-x-1/2 w-[44rem] h-[44rem] rounded-full pointer-events-none" style="background: radial-gradient(circle, rgba(8,153,8,0.14) 0%, rgba(0,0,0,0) 65%);"></div>
        <div class="relative max-w-6xl mx-auto grid md:grid-cols-2 gap-10 items-start">
          <div>
            <div class="inline-flex items-center gap-2 bg-white/5 border border-white/10 rounded-full px-4 py-2 mb-6"><span class="w-5 h-5 rounded-full bg-[#089908]/20 border border-[#089908] text-[#089908] flex items-center justify-center text-[10px]"><i class="fa-regular fa-envelope"></i></span><span class="text-xs font-black uppercase tracking-[0.2em] text-gray-300">Contact</span></div>
            <h1 class="text-5xl md:text-6xl font-black tracking-tight text-white mb-4">Get in touch<span class="text-[#089908]">.</span></h1>
            <p class="text-gray-400 mb-10 max-w-sm">Questions, bookings or features — if it's LEO SNOW, it starts here.</p>
            <div class="space-y-4">
              <a href="mailto:leosnowbookings@gmail.com?subject=Inquiry%20from%20website" class="group flex items-center gap-4 bg-white/[0.03] border border-white/10 rounded-2xl p-4 hover:border-[#089908]/60 transition-all"><span class="w-12 h-12 rounded-xl bg-white/5 border border-white/10 flex items-center justify-center text-white shrink-0"><i class="fa-regular fa-envelope"></i></span><span class="flex-1 min-w-0"><span class="block font-black text-white">Email us</span><span class="block text-sm text-gray-400 truncate">leosnowbookings@gmail.com</span></span><span class="w-9 h-9 rounded-full bg-white/10 flex items-center justify-center text-white shrink-0 group-hover:bg-[#089908] group-hover:text-black transition-colors"><i class="fa fa-arrow-right" style="transform: rotate(-45deg);"></i></span></a>
              <a href="music.html" class="group flex items-center gap-4 bg-white/[0.03] border border-white/10 rounded-2xl p-4 hover:border-[#089908]/60 transition-all"><span class="w-12 h-12 rounded-xl bg-white/5 border border-white/10 flex items-center justify-center text-white shrink-0"><i class="fa-solid fa-headphones"></i></span><span class="flex-1 min-w-0"><span class="block font-black text-white">Listen</span><span class="block text-sm text-gray-400">LEO SNOW on all platforms</span></span><span class="w-9 h-9 rounded-full bg-white/10 flex items-center justify-center text-white shrink-0 group-hover:bg-[#089908] group-hover:text-black transition-colors"><i class="fa fa-arrow-right" style="transform: rotate(-45deg);"></i></span></a>
            </div>
            <div class="mt-8 pt-6 border-t border-white/10">
              <p class="text-[10px] font-black uppercase tracking-[0.25em] text-white/50 mb-4">Follow the storm</p>
              <div class="flex flex-wrap gap-3">${chips}</div>
            </div>
          </div>
          <form id="contactForm" class="bg-white/[0.03] border border-white/10 rounded-3xl p-4 md:p-5 space-y-3 backdrop-blur-sm">
            <input type="text" id="contactName" placeholder="Name" class="field">
            <input type="email" id="contactEmail" placeholder="Email" class="field">
            <textarea id="contactMessage" placeholder="Message" rows="8" class="field resize-none"></textarea>
            <button type="submit" class="w-full bg-[#089908] text-black font-black uppercase tracking-wide rounded-xl py-4 hover:bg-[#FFDE21] transition-colors">Submit</button>
          </form>
        </div>
      </main>`;
    }

    function Footer() {
      const s = appData.socials || {};
      const socials = [["youtube","fa-brands fa-youtube"],["instagram","fa-brands fa-instagram"],["tiktok","fa-brands fa-tiktok"],["twitter","fa-brands fa-x-twitter"],["spotify","fa-brands fa-spotify"],["soundcloud","fa-brands fa-soundcloud"]].filter(([k]) => s[k]).map(([k, ic]) => `<a href="${escapeHtml(s[k])}" target="_blank" aria-label="${k}" class="w-10 h-10 rounded-full border border-white/20 flex items-center justify-center text-white hover:bg-[#089908] hover:text-black hover:border-[#089908] transition-all"><i class="${ic}"></i></a>`).join("");
      return `<footer class="py-16 px-6 bg-black border-t border-white/5 text-center"><div class="flex justify-center gap-3 mb-8">${socials}</div><div class="text-4xl font-black tracking-tighter italic mb-6">LEO SNOW</div><div class="flex flex-wrap justify-center gap-x-6 gap-y-2 mb-8 text-[11px] font-black uppercase tracking-[0.18em] opacity-60"><a href="privacy.html" class="hover:text-[#089908]">Privacy</a><a href="terms.html" class="hover:text-[#089908]">Terms</a><a href="contact.html" class="hover:text-[#089908]">Contact</a></div><p class="font-bold opacity-30 uppercase tracking-[0.5em] text-sm">© 2026 LEO SNOW WORLDWIDE</p></footer>`;
    }

    function renderApp() {
      document.getElementById("root").innerHTML = Header() + ContactPage() + Footer();
      const form = document.getElementById('contactForm');
      if (form) {
        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          const name = document.getElementById('contactName')?.value.trim();
          const email = document.getElementById('contactEmail')?.value.trim();
          const message = document.getElementById('contactMessage')?.value.trim();
          if (!name || !email || !message) { toast('❌ Please fill all fields', 'error'); return; }
          if (sb) {
            const { error } = await sb.from('messages').insert({ name, email, message });
            if (error) { toast('❌ Failed to send. Try again.', 'error'); return; }
          }
          toast('✨ Message sent to LEO SNOW!');
          form.reset();
        });
      }
    }

    async function initBackend() {
      if (!SUPABASE_URL || !SUPABASE_ANON_KEY) return;
      try {
        await new Promise((resolve, reject) => { const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js'; s.onload = resolve; s.onerror = reject; document.head.appendChild(s); });
        sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const { data, error } = await sb.from('site_content').select('data').eq('id', 1).maybeSingle();
        if (!error && data && data.data) { appData = Object.assign(JSON.parse(JSON.stringify(DEFAULT_DATA)), data.data); appData.socials = Object.assign({}, DEFAULT_DATA.socials, appData.socials || {}); renderApp(); }
        sb.channel('site-content').on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'site_content' }, (payload) => { appData = Object.assign(JSON.parse(JSON.stringify(DEFAULT_DATA)), payload.new.data); appData.socials = Object.assign({}, DEFAULT_DATA.socials, appData.socials || {}); renderApp(); }).subscribe();
      } catch (e) { console.warn('Supabase init failed', e); }
    }

    renderApp();
    initBackend();
  </script>
</body>
</html>
