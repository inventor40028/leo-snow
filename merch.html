<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>LEO SNOW – Merch | Official Store</title>
  <meta name="description" content="Official LEO SNOW merchandise. The storm is being prepared — the drop lands here.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://inventor40028.github.io/leo-snow/merch.html">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
    * { font-family: 'Inter', system-ui, sans-serif; }
    html { scroll-behavior: smooth; }
    body { background: #000; overflow-x: hidden; }
    ::-webkit-scrollbar { width: 10px; }
    ::-webkit-scrollbar-track { background: #0a0a0a; }
    ::-webkit-scrollbar-thumb { background: #089908; }
    ::selection { background: #089908; color: black; }
    button, a.btn-new { border-radius: 1rem; }
  </style>
</head>
<body class="text-white min-h-screen flex flex-col">
  <div id="root" class="flex-1 flex flex-col"></div>

  <script>
    const SUPABASE_URL = "https://cwotoefcpjehfhxidbaw.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN3b3RvZWZjcGplaGZoeGlkYmF3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyMjE2MjEsImV4cCI6MjEwNjc5NzYyMX0.3aPe4qed65H27PiVHfL1kvb_Vj_QIsH69chNbAp2ZDw";
    let sb = null;

    const DEFAULT_DATA = { socials: {} };
    let appData = JSON.parse(JSON.stringify(DEFAULT_DATA));

    function escapeHtml(str) { if (!str) return ''; return String(str).replace(/[&<>"']/g, function(m) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]; }); }

    function Header() {
      return `<nav class="sticky top-0 z-50 bg-black/90 backdrop-blur-md border-b border-white/10"><div class="max-w-7xl mx-auto px-6 h-14 flex items-center justify-between gap-4"><a href="index.html" class="text-lg font-black tracking-widest text-white hover:italic transition-all shrink-0">LEO SNOW</a><div class="flex items-center gap-6 text-[11px] font-bold uppercase tracking-[0.18em] text-gray-300"><a href="index.html" class="hover:text-white border-b-2 border-transparent hover:border-[#089908] transition-all">Home</a><a href="music.html" class="hover:text-white border-b-2 border-transparent hover:border-[#089908] transition-all">Music</a><a href="about.html" class="hover:text-white border-b-2 border-transparent hover:border-[#089908] transition-all">About</a><a href="index.html#videos" class="hover:text-white border-b-2 border-transparent hover:border-[#089908] transition-all">Videos</a><a href="index.html#contact" class="hover:text-white border-b-2 border-transparent hover:border-[#089908] transition-all">Booking</a></div></div></nav>`;
    }

    function MerchPage() {
      const s = appData.socials || {};
      const ig = s.instagram || "#";
      return `<main class="flex-1 flex items-center justify-center py-24 px-6 relative overflow-hidden">
        <div class="absolute inset-0 pointer-events-none select-none text-center font-black uppercase leading-none text-white/[0.05]" style="font-size: clamp(5rem, 18vw, 16rem); transform: translateY(15%);">Merch</div>
        <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[44rem] h-[44rem] rounded-full pointer-events-none" style="background: radial-gradient(circle, rgba(8,153,8,0.12) 0%, rgba(0,0,0,0) 65%);"></div>
        <div class="relative text-center max-w-2xl">
          <div class="inline-flex items-center gap-2 bg-white/5 border border-white/10 rounded-full px-4 py-2 mb-8"><span class="w-5 h-5 rounded-full bg-[#089908]/20 border border-[#089908] text-[#089908] flex items-center justify-center text-[10px]"><i class="fa-solid fa-shirt"></i></span><span class="text-xs font-black uppercase tracking-[0.2em] text-gray-300">Merch</span></div>
          <h1 class="text-6xl md:text-9xl font-black uppercase tracking-tighter text-[#089908] mb-6">Coming Soon</h1>
          <p class="text-xl md:text-2xl font-bold text-white mb-4">The merchandise drop is being prepared.</p>
          <p class="text-gray-400 mb-12">Every piece is designed with the storm in mind. This is where the official LEO SNOW store will live — tees, hoodies and more, straight from the cold wave.</p>
          <div class="flex flex-col sm:flex-row gap-4 justify-center">
            <a href="${escapeHtml(ig)}" target="_blank" class="bg-[#089908] text-black px-8 py-4 font-black uppercase tracking-wide hover:bg-[#FFDE21] transition-all shadow-[8px_8px_0px_0px_rgba(255,255,255,0.15)]">Follow The Drop On Instagram →</a>
            <a href="index.html" class="border border-white/25 text-white px-8 py-4 font-black uppercase tracking-wide hover:border-[#089908] transition-all">Back To Site</a>
          </div>
        </div>
      </main>`;
    }

    function Footer() {
      const s = appData.socials || {};
      const socials = [["youtube", "fa-brands fa-youtube"], ["instagram", "fa-brands fa-instagram"], ["tiktok", "fa-brands fa-tiktok"], ["twitter", "fa-brands fa-x-twitter"], ["spotify", "fa-brands fa-spotify"], ["soundcloud", "fa-brands fa-soundcloud"]].filter(([k]) => s[k]).map(([k, ic]) => `<a href="${escapeHtml(s[k])}" target="_blank" aria-label="${k}" class="w-10 h-10 rounded-full border border-white/20 flex items-center justify-center text-white hover:bg-[#089908] hover:text-black hover:border-[#089908] transition-all"><i class="${ic}"></i></a>`).join("");
      return `<footer class="py-16 px-6 bg-black border-t border-white/5 text-center"><div class="flex justify-center gap-3 mb-8">${socials}</div><div class="text-4xl font-black tracking-tighter italic mb-6">LEO SNOW</div><div class="flex flex-wrap justify-center gap-x-6 gap-y-2 mb-8 text-[11px] font-black uppercase tracking-[0.18em] opacity-60"><a href="privacy.html" class="hover:text-[#089908]">Privacy</a><a href="terms.html" class="hover:text-[#089908]">Terms</a><a href="contact.html" class="hover:text-[#089908]">Contact</a></div><p class="font-bold opacity-30 uppercase tracking-[0.5em] text-sm">© 2026 LEO SNOW WORLDWIDE</p></footer>`;
    }

    function renderApp() {
      document.getElementById("root").innerHTML = Header() + MerchPage() + Footer();
    }

    async function initBackend() {
      if (!SUPABASE_URL || !SUPABASE_ANON_KEY) return;
      try {
        await new Promise((resolve, reject) => { const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js'; s.onload = resolve; s.onerror = reject; document.head.appendChild(s); });
        sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const { data, error } = await sb.from('site_content').select('data').eq('id', 1).maybeSingle();
        if (!error && data && data.data) { appData = Object.assign(JSON.parse(JSON.stringify(DEFAULT_DATA)), data.data); renderApp(); }
        sb.channel('site-content').on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'site_content' }, (payload) => { appData = Object.assign(JSON.parse(JSON.stringify(DEFAULT_DATA)), payload.new.data); renderApp(); }).subscribe();
      } catch (e) { console.warn('Supabase init failed', e); }
    }

    renderApp();
    initBackend();
  </script>
</body>
</html>
