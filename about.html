    }
    function escapeHtml(str) { if (!str) return ''; return String(str).replace(/[&<>"']/g, function(m) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]; }); }

    function Header() {

    function SocialsSection() {
      const s = appData.socials || {};
      const cards = SOCIALS.filter(([k]) => s[k]).map(([k, ic, label]) => `<a href="${escapeHtml(s[k])}" target="_blank" rel="noopener" class="social-card group relative flex items-center gap-4 bg-white/[0.03] border border-white/10 rounded-2xl p-4 overflow-hidden hover:border-[#089908] transition-all duration-300"><span class="absolute left-0 top-0 h-full w-0 group-hover:w-full bg-[#089908]/10 transition-all duration-500"></span><span class="relative w-12 h-12 rounded-xl bg-white/5 border border-white/10 flex items-center justify-center text-xl shrink-0 group-hover:bg-[#089908] group-hover:text-black group-hover:border-[#089908] transition-colors duration-300">${ic === null ? amIcon("text-xl") : `<i class="${ic}"></i>`}</span><span class="relative flex-1 min-w-0"><span class="block font-black text-white">${label}</span><span class="block text-[11px] text-gray-500 truncate">${escapeHtml(s[k].replace(/^https?:\/\/(www\.)?/i, '').replace(/\/$/, ''))}</span></span><i class="relative fa-solid fa-arrow-right text-white/30 group-hover:text-[#089908] transition-colors duration-300" style="transform: rotate(-45deg);"></i></a>`).join("");
      if (!cards) return "";
      const marquee = SOCIALS.filter(([k]) => s[k]).map(([, , label]) => label).join(" · ");
      return `<section class="relative py-24 px-6 overflow-hidden border-t border-white/5">
        <div class="pointer-events-none select-none absolute inset-x-0 bottom-0 text-center font-black uppercase leading-none text-white/[0.05]" style="font-size: clamp(3.5rem, 12vw, 10rem);">Socials</div>
        <div class="relative max-w-5xl mx-auto">
          <div class="text-center mb-12">
            <div class="inline-flex items-center gap-2 bg-white/5 border border-white/10 rounded-full px-4 py-2 mb-6"><span class="w-5 h-5 rounded-full bg-[#089908]/20 border border-[#089908] text-[#089908] flex items-center justify-center text-[10px]"><i class="fa-solid fa-share-nodes"></i></span><span class="text-xs font-black uppercase tracking-[0.2em] text-gray-300">Connect</span></div>

        </div>
      </section>`;
    }

    function AboutPage() {
      const bio = appData.bio || {};
      const photo = bio.photo || "pics/hero.jpg";
      const text = bio.text || DEFAULT_DATA.bio.text;
      return `<main class="relative py-20 px-6 overflow-hidden">
        <div class="absolute -top-24 left-1/2 -translate-x-1/2 w-[44rem] h-[44rem] rounded-full pointer-events-none" style="background: radial-gradient(circle, rgba(8,153,8,0.12) 0%, rgba(0,0,0,0) 65%);"></div>
        <div class="relative max-w-5xl mx-auto">
          <div class="grid md:grid-cols-2 gap-12 items-center">
            <div class="relative">
              <div class="absolute -inset-4 bg-[#089908] rotate-3 rounded-2xl"></div>
              <img src="${escapeHtml(photo)}" alt="LEO SNOW portrait" class="story-img relative aspect-[4/5] object-cover w-full rounded-2xl border-2 border-black">
            </div>
            <div>
              <div class="inline-flex items-center gap-2 bg-white/5 border border-white/10 rounded-full px-4 py-2 mb-6"><span class="w-5 h-5 rounded-full bg-[#089908]/20 border border-[#089908] text-[#089908] flex items-center justify-center text-[10px]"><i class="fa-solid fa-bolt"></i></span><span class="text-xs font-black uppercase tracking-[0.2em] text-gray-300">About</span></div>

            </div>
          </div>
        </div>
      </main>`;
    }

    function Footer() {
      const s = appData.socials || {};
      const socials = [["youtube", "fa-brands fa-youtube"], ["instagram", "fa-brands fa-instagram"], ["tiktok", "fa-brands fa-tiktok"], ["twitter", "fa-brands fa-x-twitter"], ["spotify", "fa-brands fa-spotify"], ["soundcloud", "fa-brands fa-soundcloud"]].filter(([k]) => s[k]).map(([k, ic]) => `<a href="${escapeHtml(s[k])}" target="_blank" aria-label="${k}" class="w-10 h-10 rounded-full border border-white/20 flex items-center justify-center text-white hover:bg-[#089908] hover:text-black hover:border-[#089908] transition-all"><i class="${ic}"></i></a>`).join("");
      return `<footer class="py-16 px-6 bg-black border-t border-white/5 text-center"><div class="flex justify-center gap-3 mb-8">${socials}</div><div class="text-4xl font-black tracking-tighter italic mb-6">LEO SNOW</div><div class="flex flex-wrap justify-center gap-x-6 gap-y-2 mb-8 text-[11px] font-black uppercase tracking-[0.18em] opacity-60"><a href="privacy.html" class="hover:text-[#089908]">Privacy</a><a href="terms.html" class="hover:text-[#089908]">Terms</a><a href="contact.html" class="hover:text-[#089908]">Contact</a></div><p class="font-bold opacity-30 uppercase tracking-[0.5em] text-sm">© 2026 LEO SNOW WORLDWIDE</p></footer>`;
    }

    function renderApp() {
      document.getElementById("root").innerHTML = Header() + AboutPage() + SocialsSection() + Footer();
      // colorize the portrait when it scrolls into view
      const img = document.querySelector('.story-img');
      if (img && 'IntersectionObserver' in window) {
        const io = new IntersectionObserver((entries) => { entries.forEach(e => { if (e.isIntersecting) { img.classList.add('in-view'); io.unobserve(img); } }); }, { threshold: 0.4 });
        io.observe(img);
      }
    }

    async function initBackend() {
      if (!SUPABASE_URL || !SUPABASE_ANON_KEY) return;
      try {
        await new Promise((resolve, reject) => { const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js'; s.onload = resolve; s.onerror = reject; document.head.appendChild(s); });
        sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const { data, error } = await sb.from('site_content').select('data').eq('id', 1).maybeSingle();
        if (!error && data && data.data) { appData = Object.assign(JSON.parse(JSON.stringify(DEFAULT_DATA)), data.data); appData.socials = Object.assign({}, DEFAULT_DATA.socials, appData.socials || {}); renderApp(); }
        sb.channel('site-content').on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'site_content' }, (payload) => { appData = Object.assign(JSON.parse(JSON.stringify(DEFAULT_DATA)), payload.new.data); appData.socials = Object.assign({}, DEFAULT_DATA.socials, appData.socials || {}); renderApp(); }).subscribe();
      } catch (e) { console.warn('Supabase init failed', e); }
    }

    renderApp();
    initBackend();
  </script>
