    // Focus card slider (Archives)
    function buildFocusSlider() {

      items.forEach((item, index) => {
        const numStr = String(index + 1).padStart(2, '0'), totalStr = String(items.length).padStart(2, '0');
        const title = item.title || ((item.url.split('/').pop().split('.')[0] || '').replace(/[-_]/g, ' ').replace(/\b\w/g, c => c.toUpperCase())) || ('Archive ' + numStr);

        card.innerHTML = `<img src="${escapeHtml(item.url)}" alt="${escapeHtml(title)}" loading="lazy"><div class="focus-card-content"><h3 class="focus-card-title">${escapeHtml(title)}</h3><div class="focus-card-number">${numStr} - ${totalStr}</div></div>`;

        wrap.appendChild(card);

      if (prev) prev.addEventListener('click', () => { if (focusIndex > 0) { focusIndex--; updateFocusSlider(); } });
      if (next) next.addEventListener('click', () => { if (focusIndex < items.length - 1) { focusIndex++; updateFocusSlider(); } });
      const slider = document.getElementById('focusSlider');
      if (slider) {
        slider.addEventListener('touchstart', (e) => { focusTouchX = e.touches[0].clientX; }, { passive: true });
        slider.addEventListener('touchend', (e) => { const dx = focusTouchX - e.changedTouches[0].clientX; if (Math.abs(dx) > 40) { if (dx > 0 && focusIndex < items.length - 1) { focusIndex++; updateFocusSlider(); } else if (dx < 0 && focusIndex > 0) { focusIndex--; updateFocusSlider(); } } }, { passive: true });

    function renderFocusDots() {

        const dot = document.createElement('button');
        dot.className = `w-2.5 h-2.5 rounded-full transition-all ${idx === focusIndex ? 'bg-[#089908] w-6' : 'bg-white/40 hover:bg-white/70'}`;

    function updateFocusSlider() {
      const wrap = document.getElementById('focusCards');
      if (!wrap) return;
      const cards = wrap.querySelectorAll('.focus-card');
      renderFocusDots();
      cards.forEach((card, index) => {
        const offset = index - focusIndex;
        card.classList.remove('active');
        if (offset === 0) card.classList.add('active');
        let tx = 0, ty = 0, rz = 0, scale = 1, z = 0, opacity = 1;
        if (offset === 0) { ty = -15; rz = -3.5; z = 10; }
        else if (offset === -1) { tx = -280; ty = 15; rz = 7.5; scale = 0.88; z = 8; }
        else if (offset === -2) { tx = -530; ty = -50; rz = -6; scale = 0.8; z = 6; }
        else if (offset < -2) { tx = -750; ty = -100; rz = -12; scale = 0.7; z = 4; opacity = 0; }
        else if (offset === 1) { tx = 280; ty = 35; rz = -6.5; scale = 0.88; z = 8; }
        else if (offset === 2) { tx = 520; ty = -40; rz = 5; scale = 0.8; z = 6; }
        else if (offset > 2) { tx = 750; ty = -80; rz = 12; scale = 0.7; z = 4; opacity = 0; }
        if (window.innerWidth <= 768) { tx *= 0.55; ty *= 0.5; }
        card.style.transform = `translate(${tx}px, ${ty}px) rotate(${rz}deg) scale(${scale})`;
        card.style.zIndex = z;
        card.style.opacity = opacity;
      });
    }

    // Scroll animations (with auto-typing on short bio)
    function initScrollAnimations() {
      document.querySelectorAll('.release-card.bounce-up, .release-card.bounce-from-top').forEach((card, idx) => { card.style.setProperty('--order', idx); });
      document.querySelectorAll('.show-card.fade-left, .show-card.fade-right').forEach((card, idx) => { card.style.setProperty('--order', idx); });
      const animatedElements = document.querySelectorAll('.animate-on-scroll, .fade-left, .fade-right, .bounce-up, .bounce-from-top');
      const observer = new IntersectionObserver((entries) => { entries.forEach(entry => { if (entry.isIntersecting) { setTimeout(() => { entry.target.classList.add('animated'); }, Math.random() * 100); observer.unobserve(entry.target); } }); }, { threshold: 0.5, rootMargin: '0px' });
      animatedElements.forEach(el => observer.observe(el));
      // Auto-typing on shortened bio
      const shortBioPara = document.querySelector('.bio-typing-short');
      if (shortBioPara && !shortBioPara.dataset.typed) {
        const bioObserver = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting && !shortBioPara.dataset.typed) {
              shortBioPara.dataset.typed = 'true';
              const fullText = appData.bio.text;
              const shortText = fullText.length > 150 ? fullText.substring(0, 150) + "..." : fullText;
              typeText(shortBioPara, shortText, 15);
              bioObserver.unobserve(shortBioPara);
            }
          });
        }, { threshold: 0.6, rootMargin: '0px' });
        bioObserver.observe(shortBioPara);
      }
      const storyImg = document.querySelector('.story-img');
      if (storyImg) { const imgObserver = new IntersectionObserver((entries) => { entries.forEach(entry => { if (entry.isIntersecting) { setTimeout(() => { storyImg.classList.add('grayscale-transition'); }, 500); imgObserver.unobserve(storyImg); } }); }, { threshold: 0.5, rootMargin: '0px' }); imgObserver.observe(storyImg); }

            <button id="detailPrev" class="absolute left-3 top-1/2 -translate-y-1/2 w-11 h-11 rounded-full bg-black/60 border border-white/25 text-white flex items-center justify-center hover:bg-[#089908] hover:text-black transition-colors" aria-label="Previous"><i class="fa fa-chevron-left"></i></button>

      return `

    function MusicSection() {
      const releases = appData.releases || [];
      const card = (r, idx, extra) => {
        const platforms = [["spotify", "Spotify", "fa-brands fa-spotify"], ["audiomack", "Audiomack", "fa-solid fa-headphones"], ["boomplay", "Boomplay", "fa-solid fa-play"], ["deezer", "Deezer", "fa-brands fa-deezer"], ["apple", "Apple Music", "fa-brands fa-apple"], ["youtubemusic", "YouTube Music", "fa-brands fa-youtube"], ["custom", "Website", "fa fa-link"]].filter(p => r[p[0]]);
        const links = platforms.map(p => `<a href="${escapeHtml(r[p[0]])}" target="_blank" class="flex items-center gap-2 bg-black text-white text-[11px] font-black uppercase tracking-wide px-3 py-2.5 rounded-lg hover:bg-[#089908] transition-colors"><i class="${p[2]}"></i>${p[1]}</a>`).join("");

    // Showcase detail: 3D flip expand with the About story, walk between images
    let detailIndex = 0;
    function openShowcaseDetail(index) {
      const items = appData.gallery || [];
      if (!items.length) return;
      detailIndex = index;
      updateDetailMeta();
      const overlay = document.getElementById('showcaseDetail');
      overlay.classList.add('flex');
      requestAnimationFrame(() => requestAnimationFrame(() => overlay.classList.add('open')));
      document.body.style.overflow = 'hidden';
    }
    function closeShowcaseDetail() {
      const overlay = document.getElementById('showcaseDetail');
      overlay.classList.remove('open');
      setTimeout(() => { overlay.classList.remove('flex'); document.body.style.overflow = ''; }, 380);
    }
    function updateDetailMeta() {
      const items = appData.gallery || [];
      const it = items[detailIndex] || {};
      const isAbout = !!it.about;
      document.getElementById('detailImg').src = it.url;
      document.getElementById('detailNum').textContent = String(detailIndex + 1).padStart(2, '0') + ' - ' + String(items.length).padStart(2, '0');
      document.getElementById('detailTitle').textContent = isAbout ? "I'm Leo Snow." : (it.title || 'Untitled');
      document.getElementById('detailSub').textContent = isAbout ? 'Afrobeats Artist' : '';
      document.getElementById('detailSub').style.display = isAbout ? '' : 'none';
      document.getElementById('detailDesc').textContent = isAbout ? appData.bio.text : (it.desc || '');
      document.getElementById('detailAboutBtn').style.display = isAbout ? '' : 'none';
    }
    function stepShowcase(dir) {
      const items = appData.gallery || [];
      if (!items.length) return;
      detailIndex = (detailIndex + dir + items.length) % items.length;
      const card = document.getElementById('detailCard');
      card.classList.add('swap-out');
      setTimeout(() => {
        updateDetailMeta();
        card.classList.remove('swap-out');
        card.classList.add('swap-in');
        setTimeout(() => card.classList.remove('swap-in'), 460);
      }, 270);
    }
    function initShowcaseDetail() {
      const overlay = document.getElementById('showcaseDetail');
      if (!overlay) return;
      overlay.querySelector('[data-close-detail]').addEventListener('click', closeShowcaseDetail);
      document.getElementById('detailClose').addEventListener('click', closeShowcaseDetail);
      document.getElementById('detailPrev').addEventListener('click', () => stepShowcase(-1));
      document.getElementById('detailNext').addEventListener('click', () => stepShowcase(1));

      document.addEventListener('keydown', (e) => {
        if (!overlay.classList.contains('open')) return;
        if (e.key === 'Escape') closeShowcaseDetail();
        if (e.key === 'ArrowRight') stepShowcase(1);
        if (e.key === 'ArrowLeft') stepShowcase(-1);
      });
    }

    function initMusicSection() {
      const scroller = document.getElementById('musicScroller');
      const dotsWrap = document.getElementById('musicDots');
      const items = appData.releases || [];
      document.querySelectorAll('.stream-toggle').forEach(btn => {
        btn.addEventListener('click', () => {
          // Each release is rendered twice (desktop grid + mobile scroller), so
          // search inside this button's own card — a global query would always
          // toggle the desktop copy and the mobile panel would never open.
          const panel = btn.closest('.music-card')?.querySelector('.stream-panel');
          if (!panel) return;
          const open = panel.classList.toggle('open');
          const chev = btn.querySelector('i');
          if (chev) chev.style.transform = open ? 'rotate(180deg)' : '';
          btn.classList.toggle('text-[#089908]', open);
        });
      });
      const vas = document.getElementById('viewAllShows');
      if (vas) {
        let open = false;
        vas.addEventListener('click', () => {
          open = !open;
          document.querySelectorAll('.show-extra').forEach(el => el.classList.toggle('hidden', !open));
          vas.textContent = open ? 'Show Less' : 'View All Show Dates';
        });
      }
      if (!scroller || !dotsWrap || items.length === 0) return;
      dotsWrap.innerHTML = items.slice(0, 8).map((_, i) => `<button data-i="${i}" class="h-2 rounded-full transition-all ${i === 0 ? 'w-5 bg-[#089908]' : 'w-2 bg-white/30'}" aria-label="Release ${i + 1}"></button>`).join('');
      const goTo = (i) => { const c = scroller.children[i]; if (c) scroller.scrollTo({ left: c.offsetLeft - scroller.offsetLeft, behavior: 'smooth' }); };
      dotsWrap.querySelectorAll('button').forEach(b => b.addEventListener('click', () => goTo(+b.dataset.i)));
      scroller.addEventListener('scroll', () => {
        const w = scroller.children[0] ? scroller.children[0].offsetWidth + 20 : 1;
        const i = Math.max(0, Math.min(items.length - 1, Math.round(scroller.scrollLeft / w)));
        dotsWrap.querySelectorAll('button').forEach((b, j) => { const on = j === i; b.classList.toggle('w-5', on); b.classList.toggle('w-2', !on); b.classList.toggle('bg-[#089908]', on); b.classList.toggle('bg-white/30', !on); });
      }, { passive: true });
    }

    function ContactSection() {
      return `<section id="contact" class="relative py-28 px-6 bg-black overflow-hidden"><div class="absolute inset-x-0 -top-4 text-center pointer-events-none select-none font-black uppercase leading-none" style="font-size: clamp(4rem, 15vw, 15rem); color: rgba(255,255,255,0.04);">Contact</div><div class="absolute -top-24 left-1/2 -translate-x-1/2 w-[44rem] h-[44rem] rounded-full pointer-events-none" style="background: radial-gradient(circle, rgba(8,153,8,0.14) 0%, rgba(0,0,0,0) 65%);"></div><div class="relative max-w-6xl mx-auto grid md:grid-cols-2 gap-10 items-start"><div class="fade-left animate-on-scroll"><div class="inline-flex items-center gap-2 bg-white/5 border border-white/10 rounded-full px-4 py-2 mb-6"><span class="w-5 h-5 rounded-full bg-[#089908]/20 border border-[#089908] text-[#089908] flex items-center justify-center text-[10px]"><i class="fa-regular fa-envelope"></i></span><span class="text-xs font-black uppercase tracking-[0.2em] text-gray-300">Contact</span></div><h2 class="text-5xl md:text-6xl font-black tracking-tight text-white mb-4">Get in touch<span class="text-[#089908]">.</span></h2><p class="text-gray-400 mb-10 max-w-sm">Questions, bookings or features — if it's LEO SNOW, it starts here.</p><div class="space-y-4"><a href="mailto:leosnowbookings@gmail.com?subject=Inquiry%20from%20website" class="group flex items-center gap-4 bg-white/[0.03] border border-white/10 rounded-2xl p-4 hover:border-[#089908]/60 transition-all"><span class="w-12 h-12 rounded-xl bg-white/5 border border-white/10 flex items-center justify-center text-white shrink-0"><i class="fa-regular fa-envelope"></i></span><span class="flex-1 min-w-0"><span class="block font-black text-white">Email us</span><span class="block text-sm text-gray-400 truncate"><!-- TODO: real booking email -->leosnowbookings@gmail.com</span></span><span class="w-9 h-9 rounded-full bg-white/10 flex items-center justify-center text-white shrink-0 group-hover:bg-[#089908] group-hover:text-black transition-colors"><i class="fa fa-arrow-right" style="transform: rotate(-45deg);"></i></span></a><a href="#music" class="group flex items-center gap-4 bg-white/[0.03] border border-white/10 rounded-2xl p-4 hover:border-[#089908]/60 transition-all"><span class="w-12 h-12 rounded-xl bg-white/5 border border-white/10 flex items-center justify-center text-white shrink-0"><i class="fa-solid fa-headphones"></i></span><span class="flex-1 min-w-0"><span class="block font-black text-white">Listen</span><span class="block text-sm text-gray-400">LEO SNOW on all platforms</span></span><span class="w-9 h-9 rounded-full bg-white/10 flex items-center justify-center text-white shrink-0 group-hover:bg-[#089908] group-hover:text-black transition-colors"><i class="fa fa-arrow-right" style="transform: rotate(-45deg);"></i></span></a></div></div><form id="contactForm" class="fade-right animate-on-scroll bg-white/[0.03] border border-white/10 rounded-3xl p-4 md:p-5 space-y-3 backdrop-blur-sm"><input type="text" id="contactName" placeholder="Name" class="w-full bg-[#0d0d0d] border border-white/10 rounded-xl px-4 py-4 text-white placeholder-gray-500 font-bold outline-none focus:border-[#089908] transition-colors"><input type="email" id="contactEmail" placeholder="Email" class="w-full bg-[#0d0d0d] border border-white/10 rounded-xl px-4 py-4 text-white placeholder-gray-500 font-bold outline-none focus:border-[#089908] transition-colors"><textarea id="contactMessage" placeholder="Message" rows="8" class="w-full bg-[#0d0d0d] border border-white/10 rounded-xl px-4 py-4 text-white placeholder-gray-500 font-bold outline-none focus:border-[#089908] transition-colors resize-none"></textarea><button type="submit" class="w-full bg-[#089908] text-black font-black uppercase tracking-wide rounded-xl py-4 hover:bg-[#FFDE21] transition-colors">Submit</button></form></div></section>`;

    // "Available On" streaming widget — fixed bottom-right, glass panel at 5% black
    function AvailableOn() { const s = appData.socials; const platforms = [ { key: 'youtube', label: 'YouTube', icon: 'fa-brands fa-youtube' }, { key: 'soundcloud', label: 'SoundCloud', icon: 'fa-brands fa-soundcloud' }, { key: 'applemusic', label: 'Apple Music', icon: 'fa-brands fa-apple' }, { key: 'bandcamp', label: 'BandCamp', icon: 'fa-brands fa-bandcamp' } ]; return `<div class="fixed bottom-6 right-6 z-40 hidden md:block"><div class="backdrop-blur-md bg-black/5 border border-white/10 rounded-2xl px-6 py-5 shadow-[0_10px_30px_rgba(0,0,0,0.35)]"><div class="w-8 h-0.5 bg-[#089908] mb-3"></div><p class="text-[10px] font-black uppercase tracking-[0.25em] text-white/80 mb-4">Available On</p><div class="flex flex-col gap-3">${platforms.map(p => `<a href="${escapeHtml(s[p.key] || '#')}" target="_blank" class="flex items-center gap-3 text-sm font-bold text-white/90 hover:text-[#089908] transition-colors"><i class="${p.icon} w-5 text-center"></i>${p.label}</a>`).join('')}</div></div></div>`; }

    // Bio modal
    function showBioModal(fullBio) {
      const modalOverlay = document.createElement('div');
      modalOverlay.className = 'bio-modal-overlay';
      modalOverlay.innerHTML = `
        <div class="bio-modal-container">
          <div class="bio-modal-close"><i class="fa fa-times"></i></div>
          <div class="bio-modal-content">
            <p>${escapeHtml(fullBio).replace(/\n/g, '<br>')}</p>
          </div>
        </div>
      `;
      document.body.appendChild(modalOverlay);
      document.body.style.overflow = 'hidden';
      setTimeout(() => modalOverlay.classList.add('active'), 10);
      const closeModal = () => {
        modalOverlay.classList.remove('active');
        setTimeout(() => { modalOverlay.remove(); document.body.style.overflow = ''; }, 300);
      };
      modalOverlay.querySelector('.bio-modal-close').addEventListener('click', closeModal);
      modalOverlay.addEventListener('click', (e) => { if (e.target === modalOverlay) closeModal(); });
    }

    function renderApp() {

      root.innerHTML = `<div class="min-h-screen bg-[#089908] font-sans selection:bg-black selection:text-[#089908]">${Navbar()}<main>${Hero()}${VideosSection()}</div>${MusicSection()}${ShowsSection()}${StoryShowcaseSection()}${ContactSection()}</main>${Footer()}${AvailableOn()}<div class="fixed inset-0 pointer-events-none z-[100] opacity-[0.03] bg-[url('https://grainy-gradients.vercel.app/noise.svg')]"></div></div>`;
      attachListeners();

    // All event wiring happens HERE, exactly once per render (single attach point)
    function attachListeners() {
      const MERCHDesktop = document.getElementById('MERCHBtnDesktop');
      const MERCHMobile = document.getElementById('MERCHBtnMobile');
      if (MERCHDesktop) MERCHDesktop.addEventListener('click', () => location.href = 'merch.html');
      if (MERCHMobile) MERCHMobile.addEventListener('click', () => location.href = 'merch.html');
      const mobileBtn = document.getElementById('mobileMenuBtn');
      const closeBtn = document.getElementById('closeMobileMenuBtn');
      const overlay = document.getElementById('mobileMenuOverlay');
      if (mobileBtn) mobileBtn.onclick = () => { overlay.classList.remove('hidden'); overlay.classList.add('open'); };
      if (closeBtn) closeBtn.onclick = () => { overlay.classList.add('hidden'); overlay.classList.remove('open'); };
      document.querySelectorAll('.mobile-nav-link').forEach(link => { link.onclick = () => { overlay.classList.add('hidden'); overlay.classList.remove('open'); }; });
      document.getElementById('logo-home').onclick = () => document.getElementById('home')?.scrollIntoView({ behavior: 'smooth' });

      document.querySelectorAll('.expandLinksBtn').forEach(btn => {
        btn.onclick = () => {
          const id = btn.getAttribute('data-id');
          const linksDiv = document.getElementById('releaseLinks-' + id);
          if (linksDiv) linksDiv.classList.toggle('hidden');
        };
      });

      const viewAllReleasesBtn = document.querySelector('.viewAllReleasesBtn');
      if (viewAllReleasesBtn) {
        let expanded = false;
        viewAllReleasesBtn.onclick = () => {
          expanded = !expanded;
          document.querySelectorAll('.releaseExtra').forEach(el => el.classList.toggle('hidden'));
          const remaining = document.querySelectorAll('.releaseExtra:not(.hidden)').length;
          viewAllReleasesBtn.textContent = expanded ? `Show Less Releases` : `Show More Releases (${remaining} more)`;
        };
      }
      const viewAllShowsBtn = document.querySelector('.viewAllShowsBtn');
      if (viewAllShowsBtn) {
        let expanded = false;
        viewAllShowsBtn.onclick = () => {
          expanded = !expanded;
          document.querySelectorAll('.showExtra').forEach(el => el.classList.toggle('hidden'));
          const remaining = document.querySelectorAll('.showExtra:not(.hidden)').length;
          viewAllShowsBtn.textContent = expanded ? `Show Less Events` : `Show More Events (${remaining} more)`;
        };
      }

      document.querySelectorAll('.addEventBtn').forEach(btn => {
        btn.onclick = (e) => {
          e.preventDefault();
          showAddEventModal({ date: btn.getAttribute('data-date'), venue: btn.getAttribute('data-venue'), city: btn.getAttribute('data-city') });
        };
      });

      const readMoreBtn = document.getElementById('readMoreBioBtn');
      if (readMoreBtn) readMoreBtn.addEventListener('click', () => showBioModal(appData.bio.text));

      // Contact form — Supabase insert will be wired here later
      const contactForm = document.getElementById('contactForm');
      if (contactForm) {
        contactForm.addEventListener('submit', async (e) => {
          e.preventDefault();
          const name = document.getElementById('contactName')?.value.trim();
          const email = document.getElementById('contactEmail')?.value.trim();
          const message = document.getElementById('contactMessage')?.value.trim();
          if (!name || !email || !message) { showCoolToast('❌ Please fill all fields', 'error'); return; }
          if (sb) {
            const { error } = await sb.from('messages').insert({ name, email, message });
            if (error) { showCoolToast('❌ Failed to send. Try again.', 'error'); return; }
          }
          showCoolToast('✨ Message sent to LEO SNOW! ✨');
          contactForm.reset();
        });
      }

      buildFocusSlider();
      initMusicSection();
      initShowcaseDetail();
      initScrollAnimations();
      injectStructuredData();
    }

    // Global atmosphere effect: tap pops (run once)
    function initGlobalEffects() { if (document.body.dataset.effectsInitialized === 'true') return; document.body.dataset.effectsInitialized = 'true'; document.addEventListener('pointerdown', handleTapEffect, { passive: true }); }

    let tapEffectToggle = false;
    function handleTapEffect(event) {
      const bubble = document.createElement('div');
      bubble.className = `tap-pop ${tapEffectToggle ? 'alt' : 'normal'}`;
      tapEffectToggle = !tapEffectToggle;
      bubble.style.left = `${event.clientX}px`;
      bubble.style.top = `${event.clientY}px`;
      bubble.style.opacity = '0';
      bubble.innerHTML = '<i class="fa-solid fa-music"></i>';
      document.body.appendChild(bubble);
      for (let i = 0; i < 3; i++) {
        const spark = document.createElement('div');
        spark.className = 'tap-spark';
        const angle = Math.random() * Math.PI * 2;
        const distance = 6 + Math.random() * 8;
        const dx = Math.cos(angle) * distance;
        const dy = Math.sin(angle) * distance;
        spark.style.left = `${event.clientX}px`;
        spark.style.top = `${event.clientY}px`;
        spark.style.setProperty('--dx', `${dx}px`);
        spark.style.setProperty('--dy', `${dy}px`);
        document.body.appendChild(spark);
        setTimeout(() => spark.remove(), 340);
      }
      setTimeout(() => bubble.remove(), 420);
    }

    // Hero → Story scroll zoom: the hero content approaches & fades, the hero photo dissolves,
    // and the Videos section scales up from BEHIND the hero (a walk-forward transition, no scroll-down)
    function initHeroZoom() {
      // renderApp() rebuilds the whole DOM on every Supabase update, so re-query
      // the nodes on each frame instead of caching them — cached refs go stale.
      let ticking = false;
      const update = () => {
        ticking = false;
        const stage = document.getElementById('heroStage');
        const hero = document.getElementById('home');
        const next = document.getElementById('videos');
        if (!stage || !hero || !next) return;
        const total = stage.offsetHeight - window.innerHeight;
        if (total <= 0) return;
        const p = Math.min(1, Math.max(0, window.scrollY / total));
        hero.querySelectorAll('[data-zoom]').forEach(el => {
          const speed = parseFloat(el.getAttribute('data-zoom')) || 1;
          el.style.transform = `scale(${1 + p * 0.85 * speed})`;
          el.style.opacity = String(Math.max(0, 1 - p * 1.4));
        });
        hero.querySelectorAll('[data-zoombg]').forEach(el => {
          el.style.transform = `scale(${1 + p * 0.18})`;
          el.style.opacity = String(Math.max(0, 1 - p * 1.15));
        });
        // The next section approaches from behind: deeper + invisible → full screen
        const p2 = Math.min(1, Math.max(0, (p - 0.3) / 0.7));
        next.style.opacity = String(p2);
        next.style.transform = `scale(${0.88 + 0.12 * p2})`;
        next.style.pointerEvents = p2 > 0.6 ? 'auto' : 'none';
        hero.style.pointerEvents = p > 0.5 ? 'none' : 'auto';
      };
      window.addEventListener('scroll', () => { if (!ticking) { ticking = true; requestAnimationFrame(update); } }, { passive: true });
      window.addEventListener('resize', () => { if (!ticking) { ticking = true; requestAnimationFrame(update); } }, { passive: true });
      update();
    }

    // Scroll-aware header: solid bar after leaving the top + scroll-spy for the active section
    function initHeader() {
      const header = document.getElementById('siteHeader');
      if (!header) return;
      const ids = { about: 'ABOUT', videos: 'VIDEOS', music: 'MUSIC', shows: 'EVENTS', gallery: 'VISUALS', contact: 'BOOKING' };
      const links = {};
      header.querySelectorAll('[data-nav]').forEach(a => { links[a.getAttribute('data-nav')] = a; });
      const onScroll = () => { header.classList.toggle('header-solid', window.scrollY > 40); if (window.scrollY <= 40) { Object.values(links).forEach(a => a.classList.remove('nav-active')); } };
      window.addEventListener('scroll', onScroll, { passive: true });
      onScroll();
      const setActive = (id) => {
        Object.values(links).forEach(a => a.classList.remove('nav-active'));
        if (links[ids[id]]) links[ids[id]].classList.add('nav-active');
      };
      const spy = new IntersectionObserver((entries) => {
        entries.forEach(en => { if (en.isIntersecting) setActive(en.target.id); });
      }, { rootMargin: '-35% 0px -55% 0px' });
      Object.keys(ids).forEach(id => { const s = document.getElementById(id); if (s) spy.observe(s); });
      setActive('about');
    }

    function initialize() {
      renderApp();
      initGlobalEffects();
      initHeroZoom();
      initHeader();
      initBackend();
      // Popup ad shows 5s after load — only when enabled in the (future) admin
      setTimeout(() => { if (appData && appData.popupAd && appData.popupAd.enabled && !popupShown) { showPopupAd(); popupShown = true; } }, 5000);
    }
    initialize();
  </script>
</body>
